name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests and E2E (sandbox mode)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: esim
          POSTGRES_PASSWORD: esim_dev_password
          POSTGRES_DB: esim
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U esim -d esim"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Everything runs against the simulated supplier and payment gateway; no real accounts are used.
      APP_ENV: test
      APP_URL: http://localhost:3100
      BETTER_AUTH_URL: http://localhost:3100
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      DATABASE_URL: postgresql://esim:esim_dev_password@localhost:55433/esim?schema=public
      TEST_DATABASE_URL: postgresql://esim:esim_dev_password@localhost:55433/esim_test?schema=public
      SUPPLIER_MODE: sandbox
      PAYMENT_PROVIDER: sandbox
      EMAIL_PROVIDER: log
      PAYMENT_CURRENCY: USD
      SUPPLIER_PRICE_CURRENCY: USD
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Generate throwaway secrets for this run
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "SANDBOX_SIGNING_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - name: Prepare databases
        run: |
          PGPASSWORD=esim_dev_password psql -h localhost -p 55433 -U esim -d esim -c "CREATE DATABASE esim_test"
          pnpm db:deploy
          DATABASE_URL="$TEST_DATABASE_URL" pnpm db:deploy
          pnpm db:seed

      - run: pnpm lint

      - run: pnpm typecheck

      - name: Unit and integration tests (coverage thresholds enforced)
        run: pnpm test:coverage

      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - name: Keep Playwright traces when E2E fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
